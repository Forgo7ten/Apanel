name: ${COMPOSE_PROJECT_NAME:-apanel}

x-build-settings: &build-settings
  network: ${DOCKER_BUILD_NETWORK:-host}
  args:
    PYPI_MIRROR_URL: "${PYPI_MIRROR_URL:-}"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apanel}
      POSTGRES_USER: ${POSTGRES_USER:-apanel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; copy .env.example to .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - apanel

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - apanel

  migrate:
    build:
      <<: *build-settings
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required; copy .env.example to .env}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-apanel}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; copy .env.example to .env}@postgres:5432/${POSTGRES_DB:-apanel}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
      DATABASE_COMMAND_TIMEOUT_SECONDS: ${DATABASE_COMMAND_TIMEOUT_SECONDS:-5}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - apanel

  market-data-hub:
    build:
      <<: *build-settings
      context: ./market-data-hub
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required; copy .env.example to .env}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-apanel}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; copy .env.example to .env}@postgres:5432/${POSTGRES_DB:-apanel}
      REDIS_URL: redis://redis:6379/0
      HEALTH_PROBE_TIMEOUT_SECONDS: ${HEALTH_PROBE_TIMEOUT_SECONDS:-2}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
      DATABASE_COMMAND_TIMEOUT_SECONDS: ${DATABASE_COMMAND_TIMEOUT_SECONDS:-5}
      REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS: ${REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS:-5}
      REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-5}
      ELTDX_HOSTS: "${ELTDX_HOSTS:-}"
      ELTDX_TIMEOUT_SECONDS: ${ELTDX_TIMEOUT_SECONDS:-5}
      ELTDX_PROBE_HOSTS: ${ELTDX_PROBE_HOSTS:-true}
      ELTDX_HEARTBEAT_INTERVAL_SECONDS: ${ELTDX_HEARTBEAT_INTERVAL_SECONDS:-30}
      ELTDX_BAR_PAGE_SIZE: ${ELTDX_BAR_PAGE_SIZE:-800}
      ELTDX_BAR_MAX_PAGES: ${ELTDX_BAR_MAX_PAGES:-64}
      ELTDX_QUOTE_BATCH_SIZE: ${ELTDX_QUOTE_BATCH_SIZE:-50}
      MARKET_DATA_SYNC_CONCURRENCY: ${MARKET_DATA_SYNC_CONCURRENCY:-4}
      MARKET_DATA_SYNC_MAX_SYMBOLS_PER_REQUEST: ${MARKET_DATA_SYNC_MAX_SYMBOLS_PER_REQUEST:-100}
      SECURITY_MASTER_FALLBACK_PROVIDER: ${SECURITY_MASTER_FALLBACK_PROVIDER:-akshare}
      AKSHARE_SECURITY_TIMEOUT_SECONDS: ${AKSHARE_SECURITY_TIMEOUT_SECONDS:-90}
      AKSHARE_MIN_STOCK_COUNT: ${AKSHARE_MIN_STOCK_COUNT:-1000}
      AKSHARE_MIN_ETF_COUNT: ${AKSHARE_MIN_ETF_COUNT:-1}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required; copy .env.example to .env}
    expose:
      - "8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - apanel

  security-bootstrap:
    build:
      <<: *build-settings
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required; copy .env.example to .env}
      MARKET_DATA_HUB_URL: http://market-data-hub:8001
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required; copy .env.example to .env}
    command:
      [
        "python",
        "-m",
        "app.cli",
        "bootstrap-securities",
        "--retry-until-success",
        "--retry-interval-seconds",
        "${SECURITY_BOOTSTRAP_RETRY_INTERVAL_SECONDS:-30}",
        "--timeout-seconds",
        "${SECURITY_BOOTSTRAP_TIMEOUT_SECONDS:-180}",
      ]
    depends_on:
      market-data-hub:
        condition: service_healthy
    networks:
      - apanel

  backend:
    build:
      <<: *build-settings
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required; copy .env.example to .env}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-apanel}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; copy .env.example to .env}@postgres:5432/${POSTGRES_DB:-apanel}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MARKET_DATA_HUB_URL: http://market-data-hub:8001
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required; copy .env.example to .env}
      MARKET_DATA_SYNC_BATCH_SIZE: ${MARKET_DATA_SYNC_BATCH_SIZE:-50}
      MARKET_DATA_QUOTE_TIMEOUT_SECONDS: ${MARKET_DATA_QUOTE_TIMEOUT_SECONDS:-15}
      MARKET_DATA_DAILY_TIMEOUT_SECONDS: ${MARKET_DATA_DAILY_TIMEOUT_SECONDS:-60}
      MARKET_DATA_BOOTSTRAP_TIMEOUT_SECONDS: ${MARKET_DATA_BOOTSTRAP_TIMEOUT_SECONDS:-120}
      ANALYSIS_BOOTSTRAP_MIN_BARS: ${ANALYSIS_BOOTSTRAP_MIN_BARS:-400}
      ENABLE_NONE_ANALYSIS: ${ENABLE_NONE_ANALYSIS:-true}
      FEISHU_WEBHOOK_ALLOWED_HOSTS: ${FEISHU_WEBHOOK_ALLOWED_HOSTS:-open.feishu.cn,open.larksuite.com}
      APP_SECRETS_KEY: ${APP_SECRETS_KEY:-}
      APP_SECRETS_KEY_VERSION: ${APP_SECRETS_KEY_VERSION:-v1}
      LEGACY_WEBHOOK_FALLBACK_ENABLED: ${LEGACY_WEBHOOK_FALLBACK_ENABLED:-true}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required; copy .env.example to .env}
      JWT_ISSUER: ${JWT_ISSUER:-apanel}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-apanel-web}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      INVITATION_TTL_SECONDS: ${INVITATION_TTL_SECONDS:-604800}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-refresh_token}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      HEALTH_PROBE_TIMEOUT_SECONDS: ${HEALTH_PROBE_TIMEOUT_SECONDS:-2}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
      DATABASE_COMMAND_TIMEOUT_SECONDS: ${DATABASE_COMMAND_TIMEOUT_SECONDS:-5}
      REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS: ${REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS:-5}
      REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-5}
      QUOTE_REFRESH_INTERVAL_MINUTES: ${QUOTE_REFRESH_INTERVAL_MINUTES:-5}
      EOD_PIPELINE_HOUR: ${EOD_PIPELINE_HOUR:-15}
      EOD_PIPELINE_MINUTE: ${EOD_PIPELINE_MINUTE:-20}
      SCHEDULER_LOCK_TTL_SECONDS: ${SCHEDULER_LOCK_TTL_SECONDS:-3600}
      SCHEDULER_RETRY_MAX_ATTEMPTS: ${SCHEDULER_RETRY_MAX_ATTEMPTS:-3}
      SCHEDULER_RETRY_BACKOFF_SECONDS: ${SCHEDULER_RETRY_BACKOFF_SECONDS:-60}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      market-data-hub:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"
          || python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
          || python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - apanel

  scheduler:
    build:
      <<: *build-settings
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required; copy .env.example to .env}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-apanel}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; copy .env.example to .env}@postgres:5432/${POSTGRES_DB:-apanel}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MARKET_DATA_HUB_URL: http://market-data-hub:8001
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required; copy .env.example to .env}
      QUOTE_REFRESH_INTERVAL_MINUTES: ${QUOTE_REFRESH_INTERVAL_MINUTES:-5}
      EOD_PIPELINE_HOUR: ${EOD_PIPELINE_HOUR:-15}
      EOD_PIPELINE_MINUTE: ${EOD_PIPELINE_MINUTE:-20}
      SCHEDULER_LOCK_TTL_SECONDS: ${SCHEDULER_LOCK_TTL_SECONDS:-3600}
      SCHEDULER_RETRY_MAX_ATTEMPTS: ${SCHEDULER_RETRY_MAX_ATTEMPTS:-3}
      SCHEDULER_RETRY_BACKOFF_SECONDS: ${SCHEDULER_RETRY_BACKOFF_SECONDS:-60}
    command: ["celery", "-A", "app.tasks.scheduler:celery_app", "beat", "--loglevel=INFO", "--pidfile="]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      market-data-hub:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os;
          command = open('/proc/1/cmdline', 'rb').read().decode(errors='ignore');
          raise SystemExit(0 if 'celery' in command and 'beat' in command else 1)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - apanel

  worker:
    build:
      <<: *build-settings
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required; copy .env.example to .env}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-apanel}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; copy .env.example to .env}@postgres:5432/${POSTGRES_DB:-apanel}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      MARKET_DATA_HUB_URL: http://market-data-hub:8001
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required; copy .env.example to .env}
      MARKET_DATA_SYNC_BATCH_SIZE: ${MARKET_DATA_SYNC_BATCH_SIZE:-50}
      MARKET_DATA_QUOTE_TIMEOUT_SECONDS: ${MARKET_DATA_QUOTE_TIMEOUT_SECONDS:-15}
      MARKET_DATA_DAILY_TIMEOUT_SECONDS: ${MARKET_DATA_DAILY_TIMEOUT_SECONDS:-60}
      MARKET_DATA_BOOTSTRAP_TIMEOUT_SECONDS: ${MARKET_DATA_BOOTSTRAP_TIMEOUT_SECONDS:-120}
      ANALYSIS_BOOTSTRAP_MIN_BARS: ${ANALYSIS_BOOTSTRAP_MIN_BARS:-400}
      ENABLE_NONE_ANALYSIS: ${ENABLE_NONE_ANALYSIS:-true}
      FEISHU_WEBHOOK_ALLOWED_HOSTS: ${FEISHU_WEBHOOK_ALLOWED_HOSTS:-open.feishu.cn,open.larksuite.com}
      APP_SECRETS_KEY: ${APP_SECRETS_KEY:-}
      APP_SECRETS_KEY_VERSION: ${APP_SECRETS_KEY_VERSION:-v1}
      LEGACY_WEBHOOK_FALLBACK_ENABLED: ${LEGACY_WEBHOOK_FALLBACK_ENABLED:-true}
      QUOTE_REFRESH_INTERVAL_MINUTES: ${QUOTE_REFRESH_INTERVAL_MINUTES:-5}
      EOD_PIPELINE_HOUR: ${EOD_PIPELINE_HOUR:-15}
      EOD_PIPELINE_MINUTE: ${EOD_PIPELINE_MINUTE:-20}
      SCHEDULER_LOCK_TTL_SECONDS: ${SCHEDULER_LOCK_TTL_SECONDS:-3600}
      SCHEDULER_RETRY_MAX_ATTEMPTS: ${SCHEDULER_RETRY_MAX_ATTEMPTS:-3}
      SCHEDULER_RETRY_BACKOFF_SECONDS: ${SCHEDULER_RETRY_BACKOFF_SECONDS:-60}
    command:
      ["celery", "-A", "app.tasks.worker:celery_app", "worker", "--loglevel=INFO", "--hostname=apanel@%h", "--queues=default,market-data,pipeline"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      market-data-hub:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os;
          command = open('/proc/1/cmdline', 'rb').read().decode(errors='ignore');
          raise SystemExit(0 if 'celery' in command and 'worker' in command else 1)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - apanel

  frontend:
    build:
      <<: *build-settings
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required; copy .env.example to .env}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health').then(
            response => process.exit(response.ok ? 0 : 1)
          ).catch(() => process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - apanel

  nginx:
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- http://127.0.0.1/api/health >/dev/null
          && wget -qO- http://127.0.0.1/api/v1/health >/dev/null
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - apanel

volumes:
  postgres_data:
  redis_data:

networks:
  apanel:
    driver: bridge
