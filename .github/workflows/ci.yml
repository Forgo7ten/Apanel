name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apanel
          POSTGRES_PASSWORD: apanel_test_password
          POSTGRES_DB: apanel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apanel -d apanel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APANEL_TEST_POSTGRES_URL: postgresql+asyncpg://apanel:apanel_test_password@127.0.0.1:5432/apanel_test
      DATABASE_URL: postgresql+asyncpg://apanel:apanel_test_password@127.0.0.1:5432/apanel_test
      APP_SECRETS_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Backend tests
        working-directory: backend
        run: pytest
      - name: Backend lint
        working-directory: backend
        run: ruff check .
      - name: Migration smoke test
        working-directory: backend
        run: alembic upgrade head

  market-data-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            market-data-hub/requirements.txt
            market-data-hub/requirements-dev.txt
      - name: Install Market Data Hub dependencies
        working-directory: market-data-hub
        run: pip install -r requirements-dev.txt
      - name: Market Data Hub tests
        working-directory: market-data-hub
        run: pytest
      - name: Market Data Hub lint
        working-directory: market-data-hub
        run: ruff check .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      POSTGRES_PASSWORD: apanel_test_password
      JWT_SECRET_KEY: test-secret-that-is-at-least-32-bytes-long
      INTERNAL_API_TOKEN: test-internal-api-token-that-is-long-enough
      APP_SECRETS_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
