[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# Runtime migrations replace this non-routable placeholder with Settings.database_url.
sqlalchemy.url = postgresql+asyncpg://__settings_override_required__@invalid.invalid:5432/__settings_override_required__

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
