[project]
name = "apanel-backend"
version = "0.1.0"
description = "Apanel modular FastAPI backend foundation"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "argon2-cffi>=23.1,<26",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "PyJWT>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "redis>=5.2,<6",
  "SQLAlchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.30,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
